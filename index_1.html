<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puente Clínico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: barra superior con rol + menú lateral (pestañas en móvil) + contenido en tarjetas. Paleta: verde azulado clínico, neutros fríos, semáforo para estados. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#15211f; --muted:#5a6866; --line:#dbe3e1;
  --accent:#0b6b66; --accent-ink:#ffffff; --accent-soft:#e0efec;
  --ok:#2f7a4c; --ok-soft:#e3f2e8; --warn:#a8670f; --warn-soft:#fbf0dc; --crit:#b8322a; --crit-soft:#fbe5e2;
  --info:#2c5aa0; --info-soft:#e4ecf8;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(10,40,38,.06),0 4px 14px rgba(10,40,38,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1514; --surface:#162120; --ink:#e6eeec; --muted:#9aaba8;
    --line:#283836; --accent:#4fbcb2; --accent-ink:#06201e; --accent-soft:#18322f;
    --ok:#6cc68f; --ok-soft:#163023; --warn:#e3a94f; --warn-soft:#33270f; --crit:#f07a6f; --crit-soft:#3a1b18;
    --info:#86aef0; --info-soft:#1a2740; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#162120; --ink:#e6eeec; --muted:#9aaba8;
  --line:#283836; --accent:#4fbcb2; --accent-ink:#06201e; --accent-soft:#18322f;
  --ok:#6cc68f; --ok-soft:#163023; --warn:#e3a94f; --warn-soft:#33270f; --crit:#f07a6f; --crit-soft:#3a1b18;
  --info:#86aef0; --info-soft:#1a2740; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:650;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:20px} h3{font-size:16px;font-family:var(--body);font-weight:700;letter-spacing:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Top bar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{width:20px;height:20px}
.brand b{font-family:var(--display);font-size:19px;font-weight:650}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1.1}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.top select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:230px}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:38px;display:grid;place-items:center;cursor:pointer;text-decoration:none;color:var(--ink)}
.bell svg{width:19px;height:19px}
.bell .dot{position:absolute;top:-6px;right:-6px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:19px;height:19px;padding:0 5px;display:grid;place-items:center}
.mode{font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.mode.live{color:var(--ok);border-color:currentColor}

/* Shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;max-width:1180px;margin:0 auto;padding:22px 20px 60px}
nav.side{position:sticky;top:78px;align-self:start;display:flex;flex-direction:column;gap:2px}
nav.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--ink);text-decoration:none;font-weight:500}
nav.side a:hover{background:var(--surface)}
nav.side a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
nav.side a .c{margin-left:auto;font-size:12px;background:var(--crit);color:#fff;border-radius:999px;padding:0 7px;font-weight:700}
nav.side svg{width:18px;height:18px;flex:none}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{color:var(--muted);margin-top:4px}

/* Components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:12px;align-items:flex-start}
.row .grow{flex:1;min-width:0}
.meta{color:var(--muted);font-size:13.5px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-crit{background:var(--crit-soft);color:var(--crit)} .p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--bg);color:var(--muted)}
.stripe{border-left:4px solid var(--line)}
.stripe.s-crit{border-left-color:var(--crit)} .stripe.s-warn{border-left-color:var(--warn)} .stripe.s-ok{border-left-color:var(--ok)} .stripe.s-info{border-left-color:var(--info)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.empty{text-align:center;padding:28px 18px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.empty .btn{margin-top:12px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--r);background:var(--crit-soft);color:var(--ink);font-size:14px}
.banner svg{width:20px;height:20px;color:var(--crit);flex:none;margin-top:1px}
.banner.info{background:var(--info-soft)} .banner.info svg{color:var(--info)}
.stat{padding:14px 16px}
.stat .n{font-family:var(--display);font-size:32px;font-weight:650;line-height:1.1}
.stat .l{color:var(--muted);font-size:13.5px}
.stat.alert .n{color:var(--crit)}
a.stat{text-decoration:none;color:inherit;display:block}
a.stat:hover{border-color:var(--accent)}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.quick button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.quick button:hover{border-color:var(--accent)}
.quick svg{width:22px;height:22px;color:var(--accent)}
.quick b{font-size:15px} .quick span{color:var(--muted);font-size:13px}
.daygroup>h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0 8px}
.time{font-family:var(--display);font-size:20px;font-weight:650;min-width:62px}
.note{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14px;margin-top:8px}
.unread{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;margin-top:7px}
.read{width:9px;height:9px;flex:none}
.tabsmini{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabsmini button{border:0;background:none;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabsmini button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(8,20,19,.45);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto}
.overlay.open{display:flex}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:560px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet .body{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.sheet footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x{border:0;background:none;cursor:pointer;font-size:22px;line-height:1;color:var(--muted);padding:4px 8px;border-radius:6px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}
label.f small{font-weight:400;color:var(--muted)}
.f input,.f select,.f textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-weight:400}
.f textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.f select,.f input{width:100%;min-width:0;text-overflow:ellipsis}
.err{color:var(--crit);font-size:13px;font-weight:500}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slots .chip{font-variant-numeric:tabular-nums}
.thread{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:4px}
.msg{max-width:85%;padding:9px 12px;border-radius:12px;font-size:14.5px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.msg small{display:block;opacity:.75;font-size:11.5px;margin-top:3px}
.checkrow{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.checkrow input{margin-top:4px}
.daysel{display:flex;gap:5px;flex-wrap:wrap}
.daysel label{border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;font-weight:500;font-size:14px}
.daysel input{margin-right:5px}

.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.ubic{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:12px;align-items:end;padding:12px 16px}
.ubic-ico{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;align-self:center}
.ubic-ico svg{width:19px;height:19px}
.ubic select:disabled{opacity:.55}
.regbtn{display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer;padding:12px 14px}
.regbtn:hover{border-color:var(--accent)}
.regbtn b{display:block;font-size:14.5px}
.regnum{font-family:var(--display);font-weight:650;font-size:15px;min-width:38px;height:38px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.place{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13.5px;margin-top:2px}
.place svg{width:14px;height:14px;flex:none}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tag{font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.crumb{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.crumb button{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:0}
@media (max-width:820px){ .ubic{grid-template-columns:1fr} .ubic-ico{display:none} }
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:500;z-index:60;display:none;max-width:90vw}
#toast.show{display:block}

@media (max-width:820px){
  .shell{grid-template-columns:1fr;padding:12px 16px 60px;gap:14px}
  nav.side{position:sticky;top:0;flex-direction:row;overflow-x:auto;background:var(--bg);padding:6px 0;z-index:5}
  nav.side a{white-space:nowrap;padding:7px 11px}
  .top{padding:10px 16px;position:static}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){ .btn,.chip,nav.side a{transition:background .15s,border-color .15s} }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" style="color:var(--accent-ink)"><path d="M12 5v14M5 12h14"/></svg></div>
    <div><b>Puente Clínico</b><small>Paciente y médico, conectados</small></div>
  </div>
  <span id="mode" class="mode">Conectando…</span>
  <div class="seg" role="group" aria-label="Ingresar como">
    <button id="rol-pac" type="button">Paciente</button>
    <button id="rol-med" type="button">Médico</button>
  </div>
  <select id="med-sel" aria-label="Médico" hidden></select>
  <a class="bell" href="#avisos" aria-label="Avisos" id="bell">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
  </a>
</header>

<div class="shell">
  <nav class="side" id="nav" aria-label="Secciones"></nav>
  <main id="view"></main>
</div>

<div class="overlay" id="overlay" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <header><h2 id="m-title"></h2><button class="x" type="button" id="m-close" aria-label="Cerrar">×</button></header>
    <div id="m-content"></div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
const DIAS_L = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const today = () => ymd(new Date());
const fFecha = s => { const d = parseYmd(s); return `${DIAS[d.getDay()]} ${pad(d.getDate())}-${pad(d.getMonth()+1)}`; };
const fFechaL = s => { const t = parseYmd(s).toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'}); return t.charAt(0).toUpperCase()+t.slice(1); };
const toMin = h => { const [a,b] = h.split(':').map(Number); return a*60+b; };
const fromMin = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
function fHace(ms){
  const s = Math.round((Date.now()-ms)/1000);
  if (s < 60) return 'recién';
  if (s < 3600) return `hace ${Math.floor(s/60)} min`;
  if (s < 86400) return `hace ${Math.floor(s/3600)} h`;
  const d = new Date(ms); return `${pad(d.getDate())}-${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function addDays(n){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+n); return ymd(d); }
const ls = { get(k,d){ try{ const v = localStorage.getItem('pc:'+k); return v==null? d : JSON.parse(v);}catch(e){return d;} },
             set(k,v){ try{ localStorage.setItem('pc:'+k, JSON.stringify(v)); }catch(e){} } };
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'),3200); }

/* RUT chileno: módulo 11 */
function rutValido(r){
  const c = String(r||'').replace(/[.\s]/g,'').toUpperCase();
  const m = c.match(/^(\d{7,8})-?([\dK])$/); if(!m) return false;
  let s=0, f=2; for (let i=m[1].length-1;i>=0;i--){ s += Number(m[1][i])*f; f = f===7?2:f+1; }
  const dv = 11-(s%11); const esp = dv===11?'0':dv===10?'K':String(dv);
  return esp===m[2];
}
function rutFmt(r){
  const c = String(r||'').replace(/[.\s-]/g,'').toUpperCase(); if(c.length<2) return r;
  const cuerpo=c.slice(0,-1), dv=c.slice(-1);
  return cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'-'+dv;
}

/* ---------- Estado ---------- */
const S = { doctors:[], items:[], avisos:[], centros:[], mode:'cargando', loaded:{doctors:false,items:false,avisos:false,centros:false}, readonly:false };
const UI = { rol: ls.get('rol','paciente'), medicoId: ls.get('medicoId',''), esp: 'Todas', horasTab:'proximas',
             region: ls.get('region',''), comuna: ls.get('comuna',''), centro: ls.get('centro','') };
let DB = null, UID = null;
const ACTIVA = ['solicitada','confirmada'];

/* ---------- Datos de demostración (solo si no hay base compartida) ---------- */
const REGIONES = [
  {id:'AP',num:'XV',nombre:'Arica y Parinacota',comunas:['Arica','Putre']},
  {id:'TA',num:'I',nombre:'Tarapacá',comunas:['Iquique','Alto Hospicio','Pozo Almonte']},
  {id:'AN',num:'II',nombre:'Antofagasta',comunas:['Antofagasta','Calama','Tocopilla','Mejillones']},
  {id:'AT',num:'III',nombre:'Atacama',comunas:['Copiapó','Vallenar','Caldera','Chañaral']},
  {id:'CO',num:'IV',nombre:'Coquimbo',comunas:['La Serena','Coquimbo','Ovalle','Illapel']},
  {id:'VS',num:'V',nombre:'Valparaíso',comunas:['Valparaíso','Viña del Mar','Quilpué','Villa Alemana','Quillota','San Antonio','Los Andes','San Felipe']},
  {id:'RM',num:'RM',nombre:'Metropolitana de Santiago',comunas:['Santiago','Providencia','Las Condes','Vitacura','Ñuñoa','Independencia','Recoleta','San Miguel','Estación Central','Maipú','La Florida','Puente Alto']},
  {id:'LI',num:'VI',nombre:"Libertador General Bernardo O'Higgins",comunas:['Rancagua','San Fernando','Santa Cruz','Rengo']},
  {id:'ML',num:'VII',nombre:'Maule',comunas:['Talca','Curicó','Linares','Cauquenes']},
  {id:'NB',num:'XVI',nombre:'Ñuble',comunas:['Chillán','San Carlos','Bulnes']},
  {id:'BI',num:'VIII',nombre:'Biobío',comunas:['Concepción','Talcahuano','Los Ángeles','Coronel','Chiguayante','San Pedro de la Paz']},
  {id:'AR',num:'IX',nombre:'La Araucanía',comunas:['Temuco','Padre Las Casas','Villarrica','Pucón','Angol']},
  {id:'LR',num:'XIV',nombre:'Los Ríos',comunas:['Valdivia','La Unión','Río Bueno','Panguipulli']},
  {id:'LL',num:'X',nombre:'Los Lagos',comunas:['Puerto Montt','Osorno','Puerto Varas','Castro','Ancud']},
  {id:'AI',num:'XI',nombre:'Aysén del General Carlos Ibáñez del Campo',comunas:['Coyhaique','Puerto Aysén','Chile Chico']},

/* ---------- Conexión a la base compartida ---------- */
async function init(){
  render();
  const timer = setTimeout(()=>{ if (S.mode==='cargando') startDemo(); }, 10000);
  if (typeof window.claude === 'undefined' || !window.claude.use){ clearTimeout(timer); startDemo(); return; }
  let db = null, user = null;
  try { db = await claude.use('db'); } catch(e){ db = null; }
  if (!db){ clearTimeout(timer); startDemo(); return; }
  try { user = await claude.use('user'); UID = user ? await user.id() : null; } catch(e){ UID = null; }
  if (!UID){ UID = ls.get('uid', null) || ('anon-'+Math.random().toString(36).slice(2,10)); ls.set('uid', UID); }
  try { if (user && user.can){ const w = await user.can('data.write'); if (w===false) S.readonly = true; } } catch(e){}
  DB = db; S.mode = 'compartido';
  const sub = (col) => db.collection(col).onSnapshot(snap => {
      S[col] = snap.docs.map(d => ({ id:d.id, ...d.data() }));
      S.loaded[col] = true;
      if (!snap.metadata.fromCache && Object.values(S.loaded).every(Boolean)) clearTimeout(timer);
      render(); refreshThread();
    }, err => { S.loaded[col] = true; toast('No se pudieron cargar los datos ('+err.code+').'); render(); });
  sub('doctors'); sub('items'); sub('avisos'); sub('centros');
}

/* ---------- Escrituras ---------- */
function rid(){ return Math.random().toString(36).slice(2,12); }
function saveLocal(){ ls.set('store', { v:1, items:S.items, avisos:S.avisos, doctors:S.doctors, centros:S.centros }); }
async function addDoc(col, data){
  if (S.readonly){ toast('Tienes acceso de solo lectura.'); throw new Error('ro'); }
  if (DB){
    try { const r = await DB.collection(col).add(data); return r.id; }
    catch(e){ handleErr(e); throw e; }
  }
  const id = rid(); S[col].push({ id, ...data }); saveLocal(); render(); refreshThread(); return id;
}
async function updDoc(col, id, patch){
  if (S.readonly){ toast('Tienes acceso de solo lectura.'); throw new Error('ro'); }
  if (DB){
    try { await DB.collection(col).doc(id).update(patch); return; }
    catch(e){ handleErr(e); throw e; }
  }
  const x = S[col].find(o => o.id === id); if (x) Object.assign(x, patch); saveLocal(); render(); refreshThread();
}
function handleErr(e){
  const c = e && e.code;
  if (c === 'invalid_argument'){ S.readonly = true; toast('No tienes permiso para guardar cambios aquí.'); render(); }
  else if (c === 'quota_exceeded') toast('La base de datos está llena. Archiva elementos antiguos.');
  else toast('No se pudo guardar. Intenta de nuevo.');
}
async function notify(para, tipo, texto, itemId){
  try { await addDoc('avisos', { para, tipo, texto, itemId: itemId||'', creado: Date.now(), leido:false }); } catch(e){}
}

const doc = id => S.doctors.find(d => d.id === id);
const docName = id => (doc(id)?.nombre) || 'Médico';
const esPac = () => UI.rol === 'paciente';
const misItems = tipo => S.items.filter(i => i.tipo===tipo && (esPac() ? i.pacienteUid===UID : i.medicoId===UI.medicoId));
const misAvisos = () => S.avisos.filter(a => a.para === (esPac() ? 'paciente:'+UID : 'medico:'+UI.medicoId)).sort((a,b)=>b.creado-a.creado);
const especialidades = (l=S.doctors) => [...new Set(l.map(d=>d.especialidad))].sort((a,b)=>a.localeCompare(b,'es'));

/* Ubicación: región → ciudad → centro */
const region = id => REGIONES.find(r=>r.id===id);
const centro = id => S.centros.find(c=>c.id===id);
const regNombre = id => { const r = region(id); return r ? `${r.num==='RM'?'':r.num+' · '}${r.nombre}` : ''; };
const centrosEn = (reg, com) => S.centros.filter(c=>(!reg||c.region===reg)&&(!com||c.comuna===com)).sort((a,b)=>a.comuna.localeCompare(b.comuna,'es')||a.nombre.localeCompare(b.nombre,'es'));
const docsEnCentro = id => S.doctors.filter(d=>d.centroId===id);
function docsEnUbic(){
  return S.doctors.filter(d=>{ const c = centro(d.centroId);
    if (UI.centro) return d.centroId===UI.centro;
    if (UI.region && (!c || c.region!==UI.region)) return false;
    if (UI.comuna && (!c || c.comuna!==UI.comuna)) return false;
    return true; });
}
function comunasDe(reg){ const r = region(reg); const extra = S.centros.filter(c=>c.region===reg).map(c=>c.comuna); return [...new Set([...(r?r.comunas:[]), ...extra])].sort((a,b)=>a.localeCompare(b,'es')); }
function setUbic(reg, com, cen){
  UI.region = reg||''; UI.comuna = com||''; UI.centro = cen||'';
  ls.set('region',UI.region); ls.set('comuna',UI.comuna); ls.set('centro',UI.centro); UI.esp='Todas';
}
function lugarTxt(){
  if (UI.centro && centro(UI.centro)) return centro(UI.centro).nombre;
  if (UI.comuna) return UI.comuna;
  if (UI.region) return 'la Región ' + (region(UI.region)?.nombre || '');
  return 'todo Chile';
}
function ubicBar(){
  const cs = centrosEn(UI.region, UI.comuna);
  return `<section class="card ubic" aria-label="Tu ubicación">
    <div class="ubic-ico" aria-hidden="true">${ico('pin')}</div>
    <label class="f">Región<select id="u-reg"><option value="">Todas las regiones</option>${REGIONES.map(r=>`<option value="${r.id}" ${r.id===UI.region?'selected':''}>${esc(r.num==='RM'?'':r.num+' · ')}${esc(r.nombre)}</option>`).join('')}</select></label>
    <label class="f">Ciudad o comuna<select id="u-com" ${UI.region?'':'disabled'}><option value="">Todas</option>${UI.region?comunasDe(UI.region).map(c=>{ const n=centrosEn(UI.region,c).length; return `<option value="${esc(c)}" ${c===UI.comuna?'selected':''}>${esc(c)}${n?` (${n})`:''}</option>`; }).join(''):''}</select></label>
    <label class="f">Centro de salud<select id="u-cen" ${UI.region?'':'disabled'}><option value="">Todos los centros</option>${UI.region?cs.map(c=>`<option value="${esc(c.id)}" ${c.id===UI.centro?'selected':''}>${esc(c.nombre)}</option>`).join(''):''}</select></label>
  </section>`;
}
function regionGrid(){
  return `<div class="grid g3">${REGIONES.map(r=>{ const cs=centrosEn(r.id); const nd=S.doctors.filter(d=>cs.some(c=>c.id===d.centroId)).length;
    return `<button class="card regbtn" data-act="ir-region" data-reg="${r.id}"><span class="regnum">${esc(r.num)}</span><span class="grow"><b>${esc(r.nombre)}</b><span class="meta">${cs.length} centro${cs.length===1?'':'s'} · ${nd} médico${nd===1?'':'s'}</span></span></button>`; }).join('')}</div>`;
}
const citaFutura = i => i.fecha > today() || (i.fecha===today() && toMin(i.hora) >= nowMin()-30);
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }

function slotsFor(d, fecha){
  if (!d || !d.disponible) return [];
  if (!(d.dias||[]).includes(parseYmd(fecha).getDay())) return [];
  const dur = Number(d.duracion)||30, out = [];
  const taken = new Set(S.items.filter(i=>i.tipo==='cita'&&i.medicoId===d.id&&i.fecha===fecha&&ACTIVA.includes(i.estado)).map(i=>i.hora));
  for (let m = toMin(d.inicio); m + dur <= toMin(d.fin); m += dur){
    const h = fromMin(m);
    if (fecha === today() && m < nowMin()+30) continue;
    out.push({ h, libre: !taken.has(h) });
  }
  return out;
}
function proxima(d){
  for (let i=0;i<30;i++){ const f = addDays(i); const s = slotsFor(d,f).find(x=>x.libre); if (s) return { fecha:f, hora:s.h }; }
  return null;
}
function hue(str){ let h=0; for (const c of String(str)) h = (h*31 + c.charCodeAt(0)) % 360; return h; }
function avatar(d){ const ini = d.nombre.replace(/^(Dra?\.)\s*/,'').split(/\s+/).map(w=>w[0]).slice(0,2).join(''); return `<div class="avatar" style="background:hsl(${hue(d.especialidad)} 45% 40%)" aria-hidden="true">${esc(ini)}</div>`; }
function diasTxt(d){ return (d.dias||[]).slice().sort().map(n=>DIAS[n]).join(', '); }

const EST = {
  solicitada:['Por confirmar','p-warn'], confirmada:['Confirmada','p-ok'], rechazada:['Rechazada','p-crit'], cancelada:['Cancelada','p-crit'], atendida:['Atendida','p-mute'],
  pendiente:['Pendiente','p-warn'], aprobada:['Aprobada','p-ok'],
  abierta:['Esperando respuesta','p-warn'], respondida:['Respondida','p-ok'], cerrada:['Cerrada','p-mute'],
  nuevo:['Nuevo','p-crit'], revision:['En revisión','p-warn'], resuelto:['Resuelto','p-ok']
};
const pill = e => { const [t,c] = EST[e]||[e,'p-mute']; return `<span class="pill ${c}">${esc(t)}</span>`; };
const GRAV = { alta:['Alta','s-crit','p-crit'], media:['Media','s-warn','p-warn'], baja:['Baja','s-info','p-info'] };

/* ---------- Íconos ---------- */
const I = {

  horas:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
  recetas:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  consultas:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  incidentes:'<path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17.5v.01"/>',
  avisos:'<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  centros:'<path d="M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16"/><path d="M2 21h20M12 7v6M9 10h6M10 21v-4h4v4"/>',
  pin:'<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>'
};
const ico = (k, cls='') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[k]}</svg>`;

/* ---------- Render ---------- */
function route(){ const h = location.hash.replace('#',''); return ['inicio','centros','medicos','horas','recetas','consultas','incidentes','avisos'].includes(h) ? h : 'inicio'; }

function render(){
  // Encabezado
  $('#rol-pac').setAttribute('aria-pressed', esPac());
  $('#rol-med').setAttribute('aria-pressed', !esPac());
  const sel = $('#med-sel');
  sel.hidden = esPac();
  const opts = '<option value="">¿Quién eres?</option>' + S.doctors.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,'es')).map(d=>`<option value="${esc(d.id)}">${esc(d.nombre)} · ${esc(d.especialidad)}</option>`).join('');
  if (sel._o !== opts){ sel.innerHTML = opts; sel._o = opts; }
  sel.value = UI.medicoId || '';
  const m = $('#mode');
  m.textContent = S.mode==='cargando' ? 'Conectando…' : S.mode==='demo' ? 'Datos en este navegador' : (S.readonly ? 'Solo lectura' : 'Datos compartidos');
  m.className = 'mode' + (S.mode==='compartido' && !S.readonly ? ' live' : '');
  m.title = S.mode==='demo' ? 'Los cambios se guardan solo en este navegador' : 'Pacientes y médicos ven los mismos datos en tiempo real';
  const unread = misAvisos().filter(a=>!a.leido).length;
  $('#bell').innerHTML = ico('avisos') + (unread ? `<span class="dot num">${unread}</span>` : '');

  // Navegación
  const r = route();
  const cnt = {
    avisos: unread,
    horas: esPac() ? 0 : misItems('cita').filter(i=>i.estado==='solicitada').length,
    recetas: esPac() ? 0 : misItems('receta').filter(i=>i.estado==='pendiente').length,
    consultas: esPac() ? misItems('consulta').filter(i=>i.estado==='respondida' && !i.leidoPac).length : misItems('consulta').filter(i=>i.estado==='abierta').length,
    incidentes: esPac() ? 0 : misItems('incidente').filter(i=>i.estado==='nuevo').length
  };
  const labels = esPac()
    ? [['inicio','Inicio'],['centros','Centros de salud'],['medicos','Médicos'],['horas','Mis horas'],['recetas','Recetas'],['consultas','Consultas'],['incidentes','Incidentes'],['avisos','Avisos']]
    : [['inicio','Resumen'],['horas','Agenda'],['recetas','Recetas'],['consultas','Consultas'],['incidentes','Incidentes'],['centros','Centros de salud'],['medicos','Médicos'],['avisos','Avisos']];
  $('#nav').innerHTML = labels.map(([k,l]) => `<a href="#${k}" ${r===k?'aria-current="page"':''}>${ico(k)}${l}${cnt[k]?`<span class="c num">${cnt[k]}</span>`:''}</a>`).join('');

  // Vista
  const v = $('#view');
  if (S.mode === 'cargando'){ v.innerHTML = `<div class="empty">Cargando agenda y médicos…</div>`; return; }
  if (!esPac() && !doc(UI.medicoId) && r !== 'medicos' && r !== 'centros'){ v.innerHTML = vElegirMedico(); bindView(); return; }
  const views = { inicio: esPac()?vInicioPac:vInicioMed, centros:vCentros, medicos:vMedicos, horas: esPac()?vHorasPac:vAgenda, recetas:vRecetas, consultas:vConsultas, incidentes:vIncidentes, avisos:vAvisos };
  v.innerHTML = views[r]();
  bindView();
}

function vElegirMedico(){
  if (!S.doctors.length) return `<div class="head"><div><h1>Equipo médico</h1><p>Aún no hay médicos registrados.</p></div></div>
    <div class="empty">Agrega el primer médico para empezar a recibir horas y solicitudes.<br><button class="btn pri" data-act="nuevo-medico">Agregar médico</button></div>`;
  return `<div class="head"><div><h1>¿Quién eres?</h1><p>Elige tu ficha para ver tu agenda, solicitudes y avisos.</p></div><button class="btn" data-act="nuevo-medico">Agregar médico</button></div>
  <div class="grid g2">${S.doctors.map(d=>`<button class="card row" style="text-align:left;cursor:pointer" data-act="soy" data-id="${esc(d.id)}">${avatar(d)}<div class="grow"><h3>${esc(d.nombre)}</h3><p class="meta">${esc(d.especialidad)}</p>${placeLine(d)}</div></button>`).join('')}</div>`;
}
function placeLine(d){
  const c = centro(d.centroId);
  return c ? `<p class="place">${ico('pin')}<span>${esc(c.nombre)} · ${esc(c.comuna)}</span></p>` : `<p class="place">${ico('pin')}<span>Sin centro asignado</span></p>`;

  <div class="banner">${ico('incidentes')}<div><b>Si es una emergencia, llama al 131 (SAMU)</b> o acude al servicio de urgencia más cercano. Los mensajes de esta app no se responden de inmediato.</div></div>

/* --- Médico: resumen --- */

  const att = [
    ...inc.map(i=>({i,k:'incidentes',t:`${i.pacienteNombre}: ${i.categoria}`,g:i.gravedad})),

/* --- Médicos por especialidad --- */

  if (UI.centro && centro(UI.centro)) parts.push(`<span>${esc(centro(UI.centro).nombre)}</span>`);
  return `<nav class="crumb" aria-label="Ubicación">${parts.join('<span aria-hidden="true">›</span>')}</nav>`;
}

  ${sin.length?`<p class="meta">Sin centros registrados aún: ${sin.map(esc).join(', ')}.${!esPac()?' Puedes agregarlos con "Agregar centro".':''}</p>`:''}`;
}
function docCard(d){

function vHorasPac(){

function cardCita(i, pac){
  const d = doc(i.medicoId); const act = ACTIVA.includes(i.estado) && citaFutura(i);
  const s = i.estado==='cancelada'||i.estado==='rechazada'?'s-crit':i.estado==='solicitada'?'s-warn':i.estado==='confirmada'?'s-ok':'';
  return `<article class="card stripe ${s}"><div class="row"><div class="time num">${esc(i.hora)}</div><div class="grow">
    <b>${pac?esc(fFechaL(i.fecha)):esc(i.pacienteNombre)}</b>
    <p class="meta">${pac?`${esc(d?.nombre||'Médico')} · ${esc(d?.especialidad||'')} · ${esc(d?.box||'')}${d&&centro(d.centroId)?' · '+esc(centro(d.centroId).nombre)+', '+esc(centro(d.centroId).comuna):''}`:`RUT ${esc(i.pacienteRut||'—')}${i.telefono?' · Tel. '+esc(i.telefono):''}`}</p>
    ${i.motivo?`<p style="margin-top:6px">${esc(i.motivo)}</p>`:''}
    ${i.estado==='cancelada'?`<div class="note"><b>Cancelada por ${i.canceladoPor==='medico'?'el médico':'el paciente'}:</b> ${esc(i.motivoCancelacion||'Sin motivo indicado')}</div>`:''}
    ${i.estado==='rechazada'?`<div class="note"><b>Motivo:</b> ${esc(i.motivoCancelacion||'Sin motivo indicado')}</div>`:''}
  </div>${pill(i.estado)}</div>
  <div class="actions">${pac
    ? (act?`<button class="btn sm danger" data-act="cancelar" data-id="${esc(i.id)}">Cancelar hora</button><button class="btn sm" data-act="nuevo-incidente" data-cita="${esc(i.id)}">Avisar atraso o problema</button>`:'')
      + ((i.estado==='cancelada'&&i.canceladoPor==='medico')||i.estado==='rechazada'?`<button class="btn sm pri" data-act="pedir-hora" data-med="${esc(i.medicoId)}">Pedir otra hora</button>`:'')
    : (i.estado==='solicitada'?`<button class="btn sm pri" data-act="confirmar" data-id="${esc(i.id)}">Confirmar</button><button class="btn sm danger" data-act="rechazar" data-id="${esc(i.id)}">Rechazar</button>`:'')

  }</div></article>`;
}

/* ---------- Eventos de la vista ---------- */
function bindView(){}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  const it = id && S.items.find(x=>x.id===id);
  switch(a){
    case 'esp': UI.esp = b.dataset.esp; render(); break;
    case 'htab': UI.horasTab = b.dataset.t; render(); break;
    case 'soy': UI.medicoId = id; ls.set('medicoId', id); render(); break;
    case 'perfil': mPerfil(); break;
    case 'pedir-hora': mPedirHora(b.dataset.med, b.dataset.cen); break;
    case 'ir-region': setUbic(b.dataset.reg,'',''); render(); break;
    case 'ir-ciudad': setUbic(UI.region, b.dataset.com, ''); render(); window.scrollTo(0,0); break;
    case 'ubic': setUbic(b.dataset.reg, b.dataset.com, b.dataset.cen); render(); break;
    case 'ver-centro': { const c = centro(id); if (c){ setUbic(c.region, c.comuna, c.id); location.hash='medicos'; render(); } break; }
    case 'nuevo-centro': mCentro(); break;
    case 'pedir-receta': mReceta(); break;
    case 'nueva-consulta': mConsulta(b.dataset.med); break;
    case 'nuevo-incidente': mIncidente(b.dataset.cita); break;
    case 'cancelar': mCancelar(it); break;
    case 'confirmar': await accionCita(it,'confirmada'); break;
    case 'rechazar': mMotivo('Rechazar solicitud de hora','Motivo para el paciente', 'Ej.: Ese bloque quedó reservado para un procedimiento. Por favor elige otro horario.', async t=>accionCita(it,'rechazada',t)); break;
    case 'atendida': await updDoc('items', it.id, {estado:'atendida', actualizado:Date.now()}).catch(()=>{}); break;
    case 'receta-ok': mMotivo('Aprobar receta','Indicaciones para el paciente','Ej.: Receta emitida por 3 meses. Retírala en farmacia con tu carnet.', async t=>accionReceta(it,'aprobada',t), true); break;
    case 'receta-no': mMotivo('Rechazar receta','Motivo y siguiente paso','Ej.: Necesito evaluarte antes de renovar. Pide una hora de control.', async t=>accionReceta(it,'rechazada',t)); break;
    case 'hilo': mHilo(id); break;
    case 'inc-estado': await accionIncidente(it, b.dataset.e); break;
    case 'disp': mDisponibilidad(doc(id)); break;
    case 'nuevo-medico': mDisponibilidad(null); break;
    case 'avisar-pacientes': mAvisarPacientes(); break;
    case 'aviso': { const av = S.avisos.find(x=>x.id===id); if (!av) break;
      if (!av.leido) updDoc('avisos', av.id, {leido:true}).catch(()=>{});
      const ref = S.items.find(x=>x.id===av.itemId);
      if (ref) { if (ref.tipo==='consulta'||ref.tipo==='incidente'){ location.hash = ref.tipo==='consulta'?'consultas':'incidentes'; mHilo(ref.id); } else location.hash = ref.tipo==='cita'?'horas':'recetas'; }
      break; }
    case 'leer-todo': for (const av of misAvisos().filter(x=>!x.leido)){ try{ await updDoc('avisos', av.id, {leido:true}); }catch(e){ break; } } break;
  }
});
$('#view').addEventListener('change', e => {
  const t = e.target;
  if (t.id==='u-reg') setUbic(t.value,'','');
  else if (t.id==='u-com') setUbic(UI.region, t.value, '');
  else if (t.id==='u-cen') { const c = centro(t.value); setUbic(UI.region, c?c.comuna:UI.comuna, t.value); }
  else return;
  render();
  const again = document.getElementById(t.id); if (again) again.focus();
});

/* ---------- Acciones ---------- */
async function accionCita(i, estado, motivo){
  const patch = { estado, actualizado:Date.now() }; if (motivo) patch.motivoCancelacion = motivo;
  if (estado==='rechazada') patch.canceladoPor = 'medico';
  try { await updDoc('items', i.id, patch); } catch(e){ return; }
  const d = docName(i.medicoId);
  if (estado==='confirmada') await notify('paciente:'+i.pacienteUid,'confirmacion',`${d} confirmó tu hora del ${fFecha(i.fecha)} a las ${i.hora}.`, i.id);
  if (estado==='rechazada') await notify('paciente:'+i.pacienteUid,'cancelacion',`${d} no pudo tomar tu hora del ${fFecha(i.fecha)} ${i.hora}: ${motivo||'sin motivo'}. Puedes pedir otro horario.`, i.id);
  toast(estado==='confirmada'?'Hora confirmada. El paciente fue avisado.':'Solicitud rechazada. El paciente fue avisado.');
}
async function accionReceta(i, estado, texto){
  try { await updDoc('items', i.id, { estado, respuesta:texto||'', actualizado:Date.now() }); } catch(e){ return; }
  await notify('paciente:'+i.pacienteUid, 'receta', `${docName(i.medicoId)} ${estado==='aprobada'?'aprobó':'rechazó'} tu solicitud de ${i.medicamento}.`, i.id);
  toast('Respuesta enviada al paciente.');
}
async function accionIncidente(i, estado){
  try { await updDoc('items', i.id, { estado, actualizado:Date.now() }); } catch(e){ return; }
  await notify('paciente:'+i.pacienteUid, 'incidente', `${docName(i.medicoId)} marcó tu incidente "${i.categoria}" como ${estado==='resuelto'?'resuelto':'en revisión'}.`, i.id);
}

/* ---------- Modales ---------- */
let MODAL = null;
function openModal(title, html, kind){
  $('#m-title').textContent = title; $('#m-content').innerHTML = html; MODAL = kind || {};
  const o = $('#overlay'); o.classList.add('open'); o.setAttribute('aria-hidden','false');
  setTimeout(()=>{ const f = $('#m-content').querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea'); f && f.focus(); }, 30);
}
function closeModal(){ const o=$('#overlay'); o.classList.remove('open'); o.setAttribute('aria-hidden','true'); MODAL=null; }
$('#m-close').onclick = closeModal;
$('#overlay').addEventListener('mousedown', e => { if (e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown', e => { if (e.key==='Escape' && MODAL) closeModal(); });
const val = id => ($('#'+id)?.value || '').trim();
const showErr = t => { const el=$('#m-err'); if (el) el.textContent = t; };
const foot = (txt, extra='') => `<footer><span id="m-err" class="err" style="margin-right:auto;align-self:center"></span>${extra}<button class="btn" type="button" data-close>Cancelar</button><button class="btn pri" type="submit">${txt}</button></footer>`;
$('#m-content').addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });

function campoPaciente(){
  const p = ls.get('perfil', {});
  return `<div class="two"><label class="f">Nombre completo<input id="p-nom" autocomplete="name" value="${esc(p.nombre||'')}" required></label>
  <label class="f">RUT<input id="p-rut" placeholder="12.345.678-5" value="${esc(p.rut||'')}" required></label></div>`;
}
function leerPaciente(){
  const nombre = val('p-nom'), rut = val('p-rut');
  if (!nombre) { showErr('Escribe tu nombre.'); return null; }
  if (!rutValido(rut)) { showErr('El RUT no es válido. Revisa el dígito verificador.'); return null; }
  const p = { ...ls.get('perfil',{}), nombre, rut: rutFmt(rut) }; ls.set('perfil', p);
  return p;
}

}

function mPedirHora(medId, cenId){
  const pre = medId && doc(medId);
  const preC = centro(pre ? pre.centroId : cenId) || null;
  const st = { reg: preC ? preC.region : UI.region, com: preC ? preC.comuna : UI.comuna, cen: preC ? preC.id : UI.centro, esp: pre ? pre.especialidad : (UI.esp!=='Todas'?UI.esp:''), med: pre ? pre.id : '', fecha:'', hora:'' };
  openModal('Pedir hora', `<form id="f"><div class="body">
    <div class="two"><label class="f">Región<select id="h-reg"><option value="">Elige tu región…</option>${REGIONES.map(r=>`<option value="${r.id}" ${r.id===st.reg?'selected':''}>${esc(r.nombre)}</option>`).join('')}</select></label>
    <label class="f">Ciudad<select id="h-com"></select></label></div>
    <div class="two"><label class="f">Centro de salud<select id="h-cen"></select></label>
    <label class="f">Especialidad<select id="h-esp"></select></label></div>
    <label class="f">Médico<select id="h-med"></select></label>
    <div id="h-nota"></div>
    <div><p style="font-weight:600;font-size:14px;margin-bottom:6px">Día</p><div id="h-dias" class="slots"><span class="meta">Elige un médico para ver sus días.</span></div></div>
    <div><p style="font-weight:600;font-size:14px;margin-bottom:6px">Horario</p><div id="h-horas" class="slots"><span class="meta">Elige un día.</span></div></div>
    <label class="f">Motivo de la consulta<textarea id="h-mot" placeholder="Ej.: Control anual, dolor de garganta hace 3 días…" required></textarea></label>
    ${campoPaciente()}
  </div>${foot('Solicitar hora')}</form>`, {kind:'hora'});
  const docsSel = () => S.doctors.filter(d=>{ const c=centro(d.centroId); return c && c.region===st.reg && (!st.com || c.comuna===st.com) && (!st.cen || d.centroId===st.cen); });
  const fillCom = () => {
    const coms = comunasDe(st.reg).filter(c=>centrosEn(st.reg,c).some(x=>docsEnCentro(x.id).length));
    if (!coms.includes(st.com)) st.com='';
    $('#h-com').disabled = !st.reg;
    $('#h-com').innerHTML = !st.reg ? '<option value="">Primero la región</option>' : `<option value="">Todas las ciudades</option>` + coms.map(c=>`<option ${c===st.com?'selected':''}>${esc(c)}</option>`).join('');
  };
  const fillCen = () => {
    const cs = centrosEn(st.reg, st.com).filter(c=>docsEnCentro(c.id).length);
    if (!cs.some(c=>c.id===st.cen)) st.cen='';
    $('#h-cen').disabled = !st.reg;
    $('#h-cen').innerHTML = !st.reg ? '<option value="">Primero la región</option>' : (cs.length ? `<option value="">${st.com?'Todos los centros de '+esc(st.com):'Todos los centros de la región'}</option>` + cs.map(c=>`<option value="${esc(c.id)}" ${c.id===st.cen?'selected':''}>${esc(c.nombre)} · ${esc(c.comuna)}</option>`).join('') : '<option value="">Sin centros con médicos en la app</option>');
  };
  const fillEsp = () => {
    const es = especialidades(docsSel());
    if (!es.includes(st.esp)) st.esp='';
    $('#h-esp').innerHTML = `<option value="">${es.length?'Elige…':'Sin especialidades aquí'}</option>` + es.map(e=>`<option ${e===st.esp?'selected':''}>${esc(e)}</option>`).join('');
  };
  const fillMed = () => {
    const l = docsSel().filter(d=>d.especialidad===st.esp);
    $('#h-med').innerHTML = `<option value="">${st.esp?'Elige…':'Primero la especialidad'}</option>` + l.map(d=>{ const p=proxima(d); return `<option value="${esc(d.id)}" ${d.id===st.med?'selected':''} ${d.disponible&&p?'':'disabled'}>${esc(d.nombre)}${st.cen?'':' · '+esc(centro(d.centroId)?.nombre||'')+(st.com?'':', '+esc(centro(d.centroId)?.comuna||''))}${!d.disponible?' (no disponible)':!p?' (sin cupos)':''}</option>`; }).join('');
    if (!l.some(d=>d.id===st.med)) st.med='';
  };
  $('#h-reg').onchange = e => { st.reg = e.target.value; st.com=''; st.cen=''; fillCom(); fillCen(); fillEsp(); fillMed(); fillDias(); };
  $('#h-com').onchange = e => { st.com = e.target.value; st.cen=''; fillCen(); fillEsp(); fillMed(); fillDias(); };
  $('#h-cen').onchange = e => { st.cen = e.target.value; fillEsp(); fillMed(); fillDias(); };
  const fillDias = () => {
    const d = doc(st.med); st.fecha=''; st.hora='';
    $('#h-nota').innerHTML = d && d.nota ? `<div class="note">${esc(d.nota)}</div>` : '';
    if (!d){ $('#h-dias').innerHTML = '<span class="meta">Elige un médico para ver sus días.</span>'; fillHoras(); return; }
    const dias = []; for (let i=0;i<21 && dias.length<10;i++){ const f=addDays(i); const s=slotsFor(d,f); if (s.length) dias.push({f, libres:s.filter(x=>x.libre).length}); }
    $('#h-dias').innerHTML = dias.length ? dias.map(x=>`<button type="button" class="chip" data-f="${x.f}" ${x.libres?'':'disabled'} aria-pressed="false">${esc(fFecha(x.f))} <span class="meta">· ${x.libres}</span></button>`).join('') : '<span class="meta">Sin días disponibles en las próximas 3 semanas.</span>';
    fillHoras();
  };
  const fillHoras = () => {
    const d = doc(st.med);
    if (!d || !st.fecha){ $('#h-horas').innerHTML = '<span class="meta">Elige un día.</span>'; return; }
    $('#h-horas').innerHTML = slotsFor(d, st.fecha).map(s=>`<button type="button" class="chip" data-h="${s.h}" ${s.libre?'':'disabled'} aria-pressed="${s.h===st.hora}">${s.h}</button>`).join('');
  };
  $('#h-esp').onchange = e => { st.esp = e.target.value; st.med=''; fillMed(); fillDias(); };
  $('#h-med').onchange = e => { st.med = e.target.value; fillDias(); };
  $('#h-dias').onclick = e => { const c=e.target.closest('[data-f]'); if(!c||c.disabled) return; st.fecha=c.dataset.f; st.hora=''; [...$('#h-dias').children].forEach(x=>x.setAttribute('aria-pressed', x===c)); fillHoras(); };
  $('#h-horas').onclick = e => { const c=e.target.closest('[data-h]'); if(!c||c.disabled) return; st.hora=c.dataset.h; [...$('#h-horas').children].forEach(x=>x.setAttribute('aria-pressed', x===c)); };
  fillCom(); fillCen(); fillEsp(); fillMed(); fillDias();
  $('#f').onsubmit = async e => {
    e.preventDefault();
    if (!st.med || !st.fecha || !st.hora) return showErr('Elige médico, día y horario.');
    if (!val('h-mot')) return showErr('Cuéntale al médico el motivo.');
    const p = leerPaciente(); if (!p) return;
    const d = doc(st.med);
    if (!slotsFor(d, st.fecha).find(s=>s.h===st.hora && s.libre)){ showErr('Ese horario se acaba de ocupar. Elige otro.'); fillHoras(); return; }
    const btn = e.submitter; if (btn) btn.disabled = true;
    try {
      const id = await addDoc('items', { tipo:'cita', medicoId:d.id, pacienteUid:UID, pacienteNombre:p.nombre, pacienteRut:p.rut, telefono:p.tel||'', estado:'solicitada', fecha:st.fecha, hora:st.hora, motivo:val('h-mot'), creado:Date.now(), actualizado:Date.now() });
      await notify('medico:'+d.id, 'nueva', `Nueva solicitud de hora: ${p.nombre}, ${fFecha(st.fecha)} ${st.hora}.`, id);
      closeModal(); location.hash = 'horas'; toast(`Hora solicitada con ${d.nombre}. Te avisaremos cuando la confirme.`);
    } catch(err){ if (btn) btn.disabled = false; }
  };
}

function selMedico(id, pre, soloTratantes){
  const mios = new Set(soloTratantes ? S.items.filter(i=>i.pacienteUid===UID).map(i=>i.medicoId) : []);
  const zona = new Set(docsEnUbic().map(d=>d.id));
  const sorted = S.doctors.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
  const opt = d => `<option value="${esc(d.id)}" ${d.id===pre?'selected':''}>${esc(d.nombre)} · ${esc(d.especialidad)}${centro(d.centroId)?' · '+esc(centro(d.centroId).nombre):''}</option>`;
  const g1 = sorted.filter(d=>mios.has(d.id)), g2 = sorted.filter(d=>!mios.has(d.id)&&UI.region&&zona.has(d.id)), g3 = sorted.filter(d=>!g1.includes(d)&&!g2.includes(d));
  const grp = (t,l) => l.length ? `<optgroup label="${esc(t)}">${l.map(opt).join('')}</optgroup>` : '';
  return `<select id="${id}"><option value="">Elige…</option>${grp('Tus médicos',g1)}${grp('En '+lugarTxt(),g2)}${grp(g1.length||g2.length?'Otros médicos':'Médicos',g3)}</select>`;
}

function mHilo(id){
  const i = S.items.find(x=>x.id===id); if (!i) return;
  if (esPac() && i.tipo==='consulta' && i.estado==='respondida' && !i.leidoPac) updDoc('items', i.id, {leidoPac:true}).catch(()=>{});
  const cerrada = i.estado==='cerrada';
  openModal(i.tipo==='consulta'?i.asunto:i.categoria, `<form id="f"><div class="body">
    <p class="meta">${esPac()?esc(docName(i.medicoId)):esc(i.pacienteNombre)+' · RUT '+esc(i.pacienteRut||'—')} · ${pill(i.estado)}</p>
    <div class="thread" id="thread">${threadHtml(i)}</div>
    ${cerrada?'<p class="meta">Esta consulta está cerrada.</p>':`<label class="f">Tu mensaje<textarea id="t-msg" placeholder="Escribe aquí…"></textarea></label>`}
  </div>${cerrada?'<footer><button class="btn" type="button" data-close>Cerrar</button></footer>':foot('Enviar', !esPac()&&i.tipo==='consulta'?'<button class="btn" type="button" id="t-cerrar">Cerrar consulta</button>':'')}</form>`, {kind:'thread', id});
  const th = $('#thread'); th.scrollTop = th.scrollHeight;
  const cerrarBtn = $('#t-cerrar'); if (cerrarBtn) cerrarBtn.onclick = async () => { try{ await updDoc('items', i.id, {estado:'cerrada', actualizado:Date.now()}); }catch(e){ return; } closeModal(); toast('Consulta cerrada.'); };
  if (cerrada) return;
  $('#f').onsubmit = async e => { e.preventDefault();
    const t = val('t-msg'); if (!t) return;
    const cur = S.items.find(x=>x.id===id); const de = esPac()?'paciente':'medico';
    const patch = { mensajes:[...(cur.mensajes||[]), {de, texto:t, ts:Date.now()}], actualizado:Date.now() };
    if (cur.tipo==='consulta'){ patch.estado = de==='medico'?'respondida':'abierta'; if (de==='medico') patch.leidoPac = false; }
    if (cur.tipo==='incidente' && de==='medico' && cur.estado==='nuevo') patch.estado = 'revision';
    try { await updDoc('items', id, patch); } catch(err){ return; }
    $('#t-msg').value = '';
    if (de==='medico') await notify('paciente:'+cur.pacienteUid, 'mensaje', `${docName(cur.medicoId)} respondió: "${cur.asunto||cur.categoria}".`, id);
    else await notify('medico:'+cur.medicoId, 'mensaje', `${cur.pacienteNombre} escribió en "${cur.asunto||cur.categoria}".`, id);
    refreshThread();
  };
}
function refreshThread(){
  if (!MODAL || MODAL.kind!=='thread') return;
  const i = S.items.find(x=>x.id===MODAL.id); const th = $('#thread'); if (!i || !th) return;
  const h = threadHtml(i); if (th._h !== h){ th.innerHTML = h; th._h = h; th.scrollTop = th.scrollHeight; }
}

function mDisponibilidad(d){
  const nuevo = !d;
  d = d || { nombre:'', especialidad:'', box:'', disponible:true, dias:[1,2,3,4,5], inicio:'09:00', fin:'13:00', duracion:30, nota:'' };
  const esps = especialidades();
  openModal(nuevo?'Agregar médico':'Mi disponibilidad', `<form id="f"><div class="body">
    ${nuevo?`<div class="two"><label class="f">Nombre<input id="d-nom" placeholder="Dra. Nombre Apellido" required></label>
    <label class="f">Especialidad<input id="d-esp" list="d-esps" placeholder="Ej.: Pediatría" required><datalist id="d-esps">${esps.map(e=>`<option value="${esc(e)}">`).join('')}</datalist></label></div>
    <label class="f">Box o consulta<input id="d-box" placeholder="Box 101"></label>`:''}
    <div class="two"><label class="f">Región donde atiendes<select id="d-reg"><option value="">Elige…</option>${REGIONES.map(r=>`<option value="${r.id}" ${r.id===(centro(d.centroId)?.region||UI.region)?'selected':''}>${esc(r.nombre)}</option>`).join('')}</select></label>
    <label class="f">Centro de salud<select id="d-cen"></select></label></div>
    <p class="meta" style="margin-top:-6px">¿Tu centro no aparece? <button type="button" class="btn sm" id="d-nuevo-cen">Agregar centro</button></p>
    <label class="checkrow"><input type="checkbox" id="d-disp" ${d.disponible?'checked':''}><span><b>Agenda abierta</b><br><span class="meta">Si la cierras, los pacientes no podrán pedir horas contigo.</span></span></label>
    <div><p style="font-weight:600;font-size:14px;margin-bottom:6px">Días de atención</p><div class="daysel">${[1,2,3,4,5,6].map(n=>`<label><input type="checkbox" name="dia" value="${n}" ${(d.dias||[]).includes(n)?'checked':''}>${DIAS_L[n].slice(0,3)}</label>`).join('')}</div></div>
    <div class="two"><label class="f">Desde<input type="time" id="d-ini" value="${esc(d.inicio)}" step="300"></label><label class="f">Hasta<input type="time" id="d-fin" value="${esc(d.fin)}" step="300"></label></div>
    <label class="f">Duración de cada hora<select id="d-dur">${[15,20,30,45,60].map(n=>`<option value="${n}" ${Number(d.duracion)===n?'selected':''}>${n} minutos</option>`).join('')}</select></label>
    <label class="f">Nota para pacientes <small>Ej.: vacaciones, licencia, cambio de box</small><input id="d-nota" value="${esc(d.nota||'')}"></label>
    ${nuevo?'':`<label class="checkrow"><input type="checkbox" id="d-avisar" checked><span>Avisar a mis pacientes con horas próximas si cierro la agenda o cambio la nota</span></label>`}
  </div>${foot('Guardar')}</form>`);
  const fillDCen = () => { const r = val('d-reg'); const cs = centrosEn(r);
    $('#d-cen').innerHTML = !r ? '<option value="">Primero la región</option>' : `<option value="">Elige…</option>` + cs.map(c=>`<option value="${esc(c.id)}" ${c.id===d.centroId?'selected':''}>${esc(c.nombre)} · ${esc(c.comuna)}</option>`).join(''); };
  $('#d-reg').onchange = fillDCen; fillDCen();
  $('#d-nuevo-cen').onclick = () => mCentro(val('d-reg'));
  $('#f').onsubmit = async e => { e.preventDefault();
    const dias = [...document.querySelectorAll('input[name=dia]:checked')].map(x=>Number(x.value));
    const data = { centroId: val('d-cen'), disponible:$('#d-disp').checked, dias, inicio:val('d-ini'), fin:val('d-fin'), duracion:Number(val('d-dur')), nota:val('d-nota') };
    if (!data.inicio || !data.fin || toMin(data.fin) <= toMin(data.inicio)) return showErr('El horario de término debe ser posterior al de inicio.');
    if (data.disponible && !dias.length) return showErr('Elige al menos un día o cierra la agenda.');
    if (!data.centroId) return showErr('Elige el centro de salud donde atiendes.');
    if (nuevo){
      const nom = val('d-nom'), esp = val('d-esp'); if (!nom || !esp) return showErr('Completa nombre y especialidad.');
      try { const id = await addDoc('doctors', { nombre:nom, especialidad:esp, box:val('d-box'), ...data }); UI.medicoId = id; ls.set('medicoId', id); closeModal(); render(); toast('Médico agregado.'); } catch(err){}
      return;
    }
    const cambioNota = data.nota !== (d.nota||''), cerro = d.disponible && !data.disponible;
    try { await updDoc('doctors', d.id, data); } catch(err){ return; }
    if ($('#d-avisar')?.checked && (cerro || (cambioNota && data.nota))){
      const ps = new Map(); S.items.filter(i=>i.tipo==='cita'&&i.medicoId===d.id&&ACTIVA.includes(i.estado)&&citaFutura(i)).forEach(i=>{ if(!ps.has(i.pacienteUid)) ps.set(i.pacienteUid,i); });
      for (const [uid, i] of ps) await notify('paciente:'+uid, 'disponibilidad', `${d.nombre}${cerro?' cerró su agenda':' actualizó su disponibilidad'}${data.nota?': '+data.nota:''}. Tu hora del ${fFecha(i.fecha)} ${i.hora} sigue registrada; si cambia, te avisaremos.`, i.id);
      toast(`Disponibilidad guardada. ${ps.size} paciente${ps.size===1?'':'s'} avisado${ps.size===1?'':'s'}.`);
    } else toast('Disponibilidad guardada.');
    closeModal();
  };
}

function mCentro(regPre){
  const reg0 = regPre || UI.region || '';
  openModal('Agregar centro de salud', `<form id="f"><div class="body">
    <label class="f">Nombre del centro<input id="k-nom" placeholder="Ej.: CESFAM Dr. Juan Pérez" required></label>
    <div class="two"><label class="f">Tipo<select id="k-tipo">${['Hospital público','Hospital universitario','Clínica privada','CESFAM','SAPU / SAR','Centro médico'].map(t=>`<option>${t}</option>`).join('')}</select></label>
    <label class="f">Región<select id="k-reg"><option value="">Elige…</option>${REGIONES.map(r=>`<option value="${r.id}" ${r.id===reg0?'selected':''}>${esc(r.nombre)}</option>`).join('')}</select></label></div>
    <label class="f">Ciudad o comuna<input id="k-com" list="k-coms" placeholder="Ej.: Temuco" required><datalist id="k-coms"></datalist></label>
  </div>${foot('Agregar centro')}</form>`);
  const fill = () => { $('#k-coms').innerHTML = comunasDe(val('k-reg')).map(c=>`<option value="${esc(c)}">`).join(''); };
  $('#k-reg').onchange = fill; fill();
  $('#f').onsubmit = async e => { e.preventDefault();
    const nombre = val('k-nom'), region = val('k-reg'), comuna = val('k-com');
    if (!nombre || !region || !comuna) return showErr('Completa nombre, región y comuna.');
    if (S.centros.some(c=>c.region===region && c.nombre.toLowerCase()===nombre.toLowerCase())) return showErr('Ese centro ya está registrado en la región.');
    try { const id = await addDoc('centros', { nombre, tipo: val('k-tipo'), region, comuna }); setUbic(region, comuna, id); closeModal(); location.hash='centros'; render(); toast('Centro agregado.'); } catch(err){}
  };
}

function mAvisarPacientes(){
  const d = doc(UI.medicoId); if (!d) return;
  const fechas = [...new Set(S.items.filter(i=>i.tipo==='cita'&&i.medicoId===d.id&&ACTIVA.includes(i.estado)&&citaFutura(i)).map(i=>i.fecha))].sort();
  openModal('Avisar a mis pacientes', `<form id="f"><div class="body">
    <p class="meta">Envía un aviso a todos los pacientes con hora un día determinado: atrasos, cambio de box, suspensión.</p>
    ${fechas.length?`<label class="f">Día<select id="v-f">${fechas.map(f=>{ const n=S.items.filter(i=>i.tipo==='cita'&&i.medicoId===d.id&&i.fecha===f&&ACTIVA.includes(i.estado)).length; return `<option value="${f}">${esc(fFechaL(f))} · ${n} paciente${n===1?'':'s'}</option>`; }).join('')}</select></label>
    <label class="f">Tipo<select id="v-t"><option value="atraso">Atraso</option><option value="disponibilidad">Cambio de box o lugar</option><option value="cancelacion">Suspensión de la agenda</option></select></label>
    <label class="f">Mensaje<textarea id="v-m" placeholder="Ej.: Voy con 40 minutos de atraso por una urgencia. Les pido paciencia."></textarea></label>
    <label class="checkrow" id="v-susp-row" hidden><input type="checkbox" id="v-susp" checked><span>Cancelar también las horas de ese día y liberar los cupos</span></label>`
    :'<div class="empty">No tienes pacientes agendados próximamente.</div>'}
  </div>${fechas.length?foot('Enviar aviso'):'<footer><button class="btn" type="button" data-close>Cerrar</button></footer>'}</form>`);
  if (!fechas.length) return;
  $('#v-t').onchange = e => { $('#v-susp-row').hidden = e.target.value!=='cancelacion'; };
  $('#f').onsubmit = async e => { e.preventDefault();
    const f = val('v-f'), t = val('v-t'), m = val('v-m'); if (!m) return showErr('Escribe el mensaje.');
    const citas = S.items.filter(i=>i.tipo==='cita'&&i.medicoId===d.id&&i.fecha===f&&ACTIVA.includes(i.estado));
    const btn = e.submitter; if (btn) btn.disabled = true;
    for (const i of citas){
      if (t==='cancelacion' && $('#v-susp').checked){ try{ await updDoc('items', i.id, {estado:'cancelada', canceladoPor:'medico', motivoCancelacion:m, actualizado:Date.now()}); }catch(err){} }
      await notify('paciente:'+i.pacienteUid, t, `${d.nombre} · ${fFecha(f)} ${i.hora}: ${m}`, i.id);
    }
    closeModal(); toast(`Aviso enviado a ${citas.length} paciente${citas.length===1?'':'s'}.`);
  };
}

/* Refrescar tiempos relativos cada minuto (solo pantalla) */
setInterval(()=>{ if (!MODAL) render(); }, 60000);
init();
</script>
